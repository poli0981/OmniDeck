name: Dependency Review

# Blocks pull requests that add dependencies with known vulnerabilities (moderate or worse) or
# with licenses that are not compatible with GPL-3.0. Required status check on main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # summary comment on failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Zlib, BSL-1.0,
            Unlicense, CC0-1.0, MPL-2.0, OFL-1.1, LGPL-2.1-or-later, LGPL-3.0-only,
            LGPL-3.0-or-later, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
