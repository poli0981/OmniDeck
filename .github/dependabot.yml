version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "nuget"]
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      # The Velopack library and the vpk CLI (.config/dotnet-tools.json) must move together.
      velopack:
        patterns: ["Velopack", "vpk"]
      wpf-ui:
        patterns: ["WPF-UI*"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet.*"]
      # Analyzers in Directory.Build.props plus the SonarScanner and XamlStyler CLIs.
      build-tooling:
        patterns:
          - "SonarAnalyzer.CSharp"
          - "Roslynator.*"
          - "Meziantou.Analyzer"
          - "ReferenceTrimmer"
          - "dotnet-sonarscanner"
          - "XamlStyler.Console"

  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels: ["dependencies", "dotnet-sdk"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
