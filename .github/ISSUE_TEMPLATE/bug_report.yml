name: Bug report
description: Something in OmniDeck is broken
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Tip: **About → Report bug** inside the app pre-fills this form (version, modules,
        console errors) and saves a `bugreport-*.zip` you can attach below.
  - type: input
    id: version
    attributes:
      label: OmniDeck version
      placeholder: "0.9.2 (commit abc1234)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version / build
      placeholder: "Windows 11 24H2 (26100.xxxx)"
    validations:
      required: true
  - type: dropdown
    id: preset
    attributes:
      label: UI preset
      options: ["Standard", "Dynamic", "Comfort"]
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Affected module / web app
      placeholder: "e.g. Web runner – Discord, Stocks, RAM governor"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help enormously.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: >
        Required for web app issues. The in-app report captures these automatically;
        manually you can copy them from the affected page's console. Paste as-is.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Attach the `bugreport-*.zip` from `%LocalAppData%\OmniDeck\reports`
        (drag & drop here), or paste the relevant tail of the latest log.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I am on the latest release
          required: true
        - label: This is not a documented web-app limitation from the README
          required: true
